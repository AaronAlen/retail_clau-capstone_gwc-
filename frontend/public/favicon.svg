<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Vibrant Orange Gradient -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#vrGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Luxury Glass Inner Border -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Bold Modern VR Monogram -->
  <text 
    x="32" 
    y="42" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" 
    font-size="28" 
    font-weight="900" 
    fill="#FFFFFF" 
    text-anchor="middle" 
    letter-spacing="-1.5"
    style="text-shadow: 0 1px 3px rgba(0,0,0,0.3);"
  >VR</text>

  <!-- Velocity Dynamic Sparkle Accent (Top-Right) -->
  <circle cx="51" cy="13" r="3.5" fill="#FEF08A"/>
</svg>
