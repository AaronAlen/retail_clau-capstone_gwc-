name: Velocity Retail - CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: "Choose Deployment Action"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "deploy_render_and_vercel"
          - "deploy_aws_demo"
          - "docker_hub_only"

env:
  NODE_VERSION: "20.x"

jobs:
  # =========================================================================
  # 1. CI: LINT, TYPECHECK & BUILD VALIDATION
  # =========================================================================
  ci-build:
    name: 🧪 CI - Build & Test (Frontend & Backend)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Verification
      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🔨 Compile Backend (TypeScript)
        working-directory: ./backend
        run: npm run build

      # Frontend Verification
      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔨 Build Frontend (Vite Production Bundle)
        working-directory: ./frontend
        run: npm run build

  # =========================================================================
  # 2. DOCKER HUB: BUILD & PUSH BACKEND CONTAINER
  # =========================================================================
  docker-hub:
    name: 🐳 Docker Hub - Build & Push Image
    needs: ci-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        if: env.DOCKER_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}

      # Build & Push Backend Container Image
      - name: 🔨 Build & Push Backend to Docker Hub
        if: env.DOCKER_USER != ''
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/velocity-retail-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/velocity-retail-backend:${{ github.sha }}
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}

  # =========================================================================
  # 3. CD: DEPLOY FRONTEND TO VERCEL (PURE VITE, NO DOCKER)
  # =========================================================================
  deploy-frontend-vercel:
    name: 🚀 Deploy Frontend (Vercel)
    needs: ci-build
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.event.inputs.target == null || github.event.inputs.target == 'all' || github.event.inputs.target == 'deploy_render_and_vercel')
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        if: env.VERCEL_TOKEN != ''
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # =========================================================================
  # 4. CD: DEPLOY BACKEND TO RENDER (PULLS DOCKER / TRIGGERS WEBHOOK)
  # =========================================================================
  deploy-backend-render:
    name: 🚀 Deploy Backend (Render)
    needs: [ci-build, docker-hub]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.event.inputs.target == null || github.event.inputs.target == 'all' || github.event.inputs.target == 'deploy_render_and_vercel')
    steps:
      - name: 🌐 Trigger Render Deploy Hook
        if: env.RENDER_HOOK != ''
        run: |
          echo "Triggering Render auto-deployment..."
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deployment triggered successfully!"
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  # =========================================================================
  # 5. CD: DEPLOY BACKEND TO AWS ECS (FOR MENTOR DEMO)
  # =========================================================================
  deploy-backend-aws:
    name: ☁️ Deploy Backend (AWS ECS Demo)
    needs: [ci-build, docker-hub]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.event.inputs.target == null || github.event.inputs.target == 'all' || github.event.inputs.target == 'deploy_aws_demo')
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS Credentials
        if: env.AWS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}

      - name: 🔄 Update AWS ECS Service with Latest Image
        if: env.AWS_KEY != '' && env.ECS_CLUSTER != ''
        run: |
          echo "Forcing new deployment on AWS ECS cluster..."
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER || 'velocity-retail-cluster' }} \
            --service ${{ secrets.ECS_SERVICE || 'velocity-retail-backend' }} \
            --force-new-deployment
          echo "AWS ECS deployment triggered successfully!"
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
